<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站立提醒 - 設定</title>
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <div class="settings-container">
    <h1 data-i18n="app.title">站立提醒設定</h1>

    <div class="field">
      <label data-i18n="label.language">語言</label>
      <select id="language">
        <option value="tw">繁體中文</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="field">
      <label for="interval" data-i18n="label.interval">提醒間隔（分鐘）</label>
      <input type="number" id="interval" min="1" max="120" value="30" />
    </div>

    <div class="field">
      <label for="custom-text" data-i18n="label.text">提醒文字</label>
      <input type="text" id="custom-text" value="" />
    </div>

    <div class="field">
      <label for="gif-path" data-i18n="label.gif">自訂 GIF</label>
      <div class="file-row">
        <input type="text" id="gif-path" data-i18n-placeholder="placeholder.gif" placeholder="使用預設 GIF" readonly />
        <button id="browse-btn" data-i18n="btn.browse">選擇檔案</button>
        <button id="clear-gif-btn" data-i18n="btn.clear">清除</button>
      </div>
    </div>

    <div class="field">
      <label for="auto-dismiss" data-i18n="label.dismiss">自動消失秒數</label>
      <input type="number" id="auto-dismiss" min="3" max="30" value="8" />
    </div>

    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="pet-mode" />
        <span data-i18n="label.pet">桌寵模式（GIF 在螢幕上隨意走動）</span>
      </label>
    </div>

    <div class="field" id="gif-direction-field" style="display:none;">
      <label data-i18n="label.direction">GIF 初始朝向</label>
      <div class="radio-row">
        <label class="radio-label"><input type="radio" name="gif-direction" value="right" checked /> <span data-i18n="direction.right">朝右 →</span></label>
        <label class="radio-label"><input type="radio" name="gif-direction" value="left" /> <span data-i18n="direction.left">← 朝左</span></label>
      </div>
    </div>

    <div class="actions">
      <button id="save-btn" class="primary" data-i18n="btn.save">儲存</button>
      <button id="test-btn" data-i18n="btn.test">測試提醒</button>
    </div>
  </div>

  <script type="module" src="js/settings.js"></script>
</body>
</html>
