<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stand Up!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      cursor: pointer;
      user-select: none;
    }
    #reminder-container {
      position: relative;
      width: 340px;
      height: 220px;
      overflow: hidden;
      background: #1a1a2e;
      animation: fadeIn 0.4s ease-out;
    }
    #reminder-container.fade-out {
      animation: fadeOut 0.4s ease-in forwards;
    }
    #gif {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #message {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(20px); }
    }
  </style>
</head>
<body>
  <div id="reminder-container">
    <img id="gif" src="default.gif" alt="reminder" />
    <div id="message">時間到了！站起來動一動！</div>
  </div>
  <script type="module" src="js/reminder.js"></script>
</body>
</html>
