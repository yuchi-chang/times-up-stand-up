<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #pet-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #gif {
      display: block;
      margin-top: auto;
      width: 120px;
      height: 120px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }
    #bubble {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #333;
      font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      font-size: 13px;
      line-height: 1.4;
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      white-space: nowrap;
      max-width: 200px;
      text-align: center;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #fff;
    }
    #bubble.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="pet-container">
    <div id="bubble" class="hidden"></div>
    <img id="gif" src="default.gif" alt="pet" />
  </div>
  <script type="module" src="js/pet.js"></script>
</body>
</html>
